name: 'Install dependencies for Catimini integration tests'
description: 'Installs required dependencies'
inputs:
  platform:
    description: 'Target platform'
    required: true
runs:
  using: "composite"
  steps:
    - if: inputs.platform == 'ubuntu-24.04'
      run : >-
        sudo apt install
        webkit2gtk-driver
        xvfb
      shell: bash
    - if: inputs.platform == 'windows-latest'
      run: |
        cargo install --git https://github.com/chippers/msedgedriver-tool
        & "$HOME/.cargo/bin/msedgedriver-tool.exe"
        $PWD.Path >> $env:GITHUB_PATH
      shell: pwsh
