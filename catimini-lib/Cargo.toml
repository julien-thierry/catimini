[package]
name = "catimini-lib"
version.workspace = true
description = "Backend library for Catimini"
license.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25.0"
notify = "8.2.0"

[dev-dependencies]
ntest = "0.9.3"
tempfile = "3.20.0"
